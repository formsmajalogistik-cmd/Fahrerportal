<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <script>
    // SPA redirect for GitHub Pages
    // Stores the attempted URL and redirects to base path index.html
    sessionStorage.redirect = location.href;
    // Keep the first path segment (repo name) and redirect to its root
    var segments = location.pathname.split('/').filter(Boolean);
    var basePath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
    location.replace(basePath);
  </script>
</head>
<body></body>
</html>
