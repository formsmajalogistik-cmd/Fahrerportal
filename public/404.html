<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <script>
    // SPA redirect for GitHub Pages
    // Stores the attempted URL and redirects to index.html
    sessionStorage.redirect = location.href;
    location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
  </script>
</head>
<body></body>
</html>
